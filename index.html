<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f4f5">
<meta name="description" content="Crie e baixe etiquetas de preço da Padaria da Cris em PNG.">
<title>Gerador de Artes — Padaria da Cris</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <h1>Gerador de Artes</h1>
    <p>Padaria da Cris — etiquetas de preço</p>
  </header>

  <div class="tabs" id="tabs" role="group" aria-label="Modelo da etiqueta">
    <button type="button" class="tab active" data-model="geladeira" aria-pressed="true">Geladeira</button>
    <button type="button" class="tab" data-model="padrao" aria-pressed="false">Padrão</button>
  </div>

  <div class="workspace">

    <form id="form" class="panel-form" onsubmit="return false;">

      <div class="field">
        <label for="nomeProduto">Nome do produto</label>
        <input type="text" id="nomeProduto" placeholder="Ex: Pão Francês" maxlength="40" autocomplete="off">
      </div>

      <div class="field">
        <label for="escalaNome">
          Tamanho do nome
          <span class="field-value" id="escalaNomeValue">100%</span>
        </label>
        <input type="range" id="escalaNome" min="60" max="150" step="5" value="100">
      </div>

      <div class="field only-padrao">
        <label for="categoria">Categoria (tag pequena)</label>
        <input type="text" id="categoria" placeholder="Ex: PADARIA" maxlength="20" autocomplete="off">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="precoInteiro">Preço (inteiro)</label>
          <input type="number" id="precoInteiro" placeholder="8" min="0" step="1" inputmode="numeric">
        </div>
        <div class="field">
          <label for="precoCentavos">Centavos</label>
          <input type="number" id="precoCentavos" placeholder="99" min="0" max="99" step="1" inputmode="numeric">
        </div>
      </div>

      <div class="field">
        <label for="escalaPreco">
          Tamanho do preço
          <span class="field-value" id="escalaPrecoValue">100%</span>
        </label>
        <input type="range" id="escalaPreco" min="60" max="150" step="5" value="100">
      </div>

      <div class="field">
        <label>Cor de destaque</label>
        <div class="color-swatches" id="corDestaque" role="group" aria-label="Cores disponíveis"></div>
      </div>

      <div class="field only-geladeira">
        <label for="orientacaoGeladeira">Formato</label>
        <select id="orientacaoGeladeira">
          <option value="portrait" selected>10 x 15 cm (retrato)</option>
          <option value="landscape">15 x 10 cm (paisagem)</option>
        </select>
      </div>

      <div class="field only-padrao">
        <label class="checkbox-label">
          <input type="checkbox" id="mostrarOferta" checked>
          Mostrar selo "OFERTA"
        </label>
      </div>

      <div class="field only-padrao">
        <label for="infoExtra">Informação extra (peso/litragem)</label>
        <input type="text" id="infoExtra" placeholder="Ex: 500g" maxlength="30" autocomplete="off">
      </div>

      <!-- Espaço da imagem: foto, selo promocional ou área vazia. -->
      <div class="field only-padrao">
        <label>Espaço da imagem</label>
        <div class="segmented" id="estadoImagemSeletor" role="group" aria-label="Conteúdo do espaço da imagem">
          <button type="button" class="segmented-btn" data-estado="foto" aria-pressed="false">Foto</button>
          <button type="button" class="segmented-btn" data-estado="promocao" aria-pressed="false">Selo "Promoção"</button>
          <button type="button" class="segmented-btn active" data-estado="nenhum" aria-pressed="true">Nenhum</button>
        </div>
      </div>

      <div class="field only-padrao" id="uploadFotoField" style="display:none;">
        <label>Foto do produto</label>
        <div class="upload-avatar" id="uploadAvatar">
          <div class="upload-avatar-preview" id="uploadAvatarPreview" role="button" tabindex="0" aria-label="Escolher foto do produto">
            <span class="upload-icon" aria-hidden="true">📷</span>
          </div>
          <button type="button" class="upload-avatar-remove" id="btnRemoverImagem" title="Remover foto" aria-label="Remover foto">×</button>
        </div>
        <span class="upload-hint">Toque na miniatura para escolher ou trocar (máximo 8 MB).</span>
        <input type="file" id="imagemProduto" accept="image/jpeg,image/png,image/webp,image/gif" class="visually-hidden">
      </div>

      <div class="field only-padrao">
        <label for="escalaImagem">
          Tamanho da imagem/selo
          <span class="field-value" id="escalaImagemValue">100%</span>
        </label>
        <input type="range" id="escalaImagem" min="60" max="160" step="5" value="100">
      </div>

      <button type="button" id="btnBaixar" class="btn-primary">Baixar arte (PNG)</button>
      <button type="button" id="btnAjustarTela" class="btn-secondary">Ajustar à tela</button>
      <p id="appStatus" class="app-status" role="status" aria-live="polite">Preparando a pré-visualização...</p>

    </form>

    <div class="panel-preview">
      <div class="preview-scroll">
        <div class="preview-scale" id="previewScale">
          <canvas id="artCanvas" role="img" aria-label="Pré-visualização da etiqueta de preço"></canvas>
        </div>
      </div>
    </div>

  </div>

</div>

<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
